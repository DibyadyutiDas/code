<!-- Contact Section -->
<section id="contact" class="section section-alt">
    <div class="container">
        <div class="section-header">
            <div class="section-icon">
                <i class="fas fa-envelope"></i>
            </div>
            <h2 class="section-title">Get In Touch</h2>
            <p class="section-description">
                Let's connect and discuss opportunities, collaborations, or just chat about technology.
            </p>
        </div>
        
        <div class="contact-content">
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fab fa-github"></i>
                    </div>
                    <div class="contact-details">
                        <h4>GitHub</h4>
                        <a href="https://github.com/DibyadyutiDas" target="_blank" rel="noopener noreferrer">
                            @DibyadyutiDas
                        </a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fab fa-linkedin"></i>
                    </div>
                    <div class="contact-details">
                        <h4>LinkedIn</h4>
                        <a href="#" target="_blank" rel="noopener noreferrer">
                            Connect with me
                        </a>
                    </div>
                </div>
                
                <div class="contact-item">
                    <div class="contact-icon">
                        <i class="fas fa-envelope"></i>
                    </div>
                    <div class="contact-details">
                        <h4>Email</h4>
                        <a href="mailto:contact@example.com">
                            contact@example.com
                        </a>
                    </div>
                </div>
            </div>
            
            <div class="contact-form">
                <h3>Send me a message</h3>
                <form>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <input type="text" id="subject" name="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Tell me about your project or just say hello!"></textarea>
                    </div>
                    <div class="form-submit">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-paper-plane"></i>
                            Send Message
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</section>
